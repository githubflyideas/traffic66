name: pages

# The project website on GitHub Pages: site/ built by site/build.py, with
# the screenshots from docs/images. Published on every change to them,
# every morning (posts dated in the future wait for their day), or by hand
# from the Actions page. It runs on v0.1, the default branch, which
# every merge to main fast-forwards: the github-pages environment only
# accepts deployments from the default branch.
on:
  push:
    branches: [v0.1]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  # every morning at 06:50 Tokyo time, so a post dated today goes out
  schedule:
    - cron: "50 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
