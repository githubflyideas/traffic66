name: pages

# The project website on GitHub Pages: site/ built by site/build.py, with
# the screenshots from docs/images. Published on every change to them,
# every hour (a post waits for 07:00 Tokyo time on its date), or by hand
# from the Actions page. It runs on main, the default branch: the
# github-pages environment only accepts deployments from the default branch.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  # every hour: a post dated today goes out with the first build after
  # 07:00 Tokyo time. Hourly because GitHub starts scheduled jobs late
  # (hours, at busy times) and sometimes skips them.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
