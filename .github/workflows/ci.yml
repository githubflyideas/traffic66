name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # One-click release: Actions → ci → Run workflow, enter a version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (leave empty to only build and clean up branches)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # built on glibc 2.28 (RHEL 8) so it runs on RHEL/Rocky/Alma 8+,
          # Ubuntu 20.04+, Debian 10+
          - os: ubuntu-22.04
            target: linux-amd64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-amd64
          # the runner's own MinGW gcc links DuckDB (as in duckdb-go's CI)
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Static C libraries (Linux)
        if: ${{ matrix.container }}
        run: |
          # only the distribution's own repositories: fetching every repository's
          # metadata from slow mirrors has taken up to 20 minutes
          quick="--disablerepo=* --enablerepo=baseos,appstream,powertools --setopt=install_weak_deps=False --setopt=timeout=30 --setopt=retries=5"
          rpm -q glibc-static || timeout 600 dnf $quick install -y glibc-static || dnf install -y glibc-static || dnf --enablerepo=powertools install -y glibc-static
      - name: Resolve modules
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          # failing tests become annotations, readable without downloading logs
          flags=""
          # GNU ld on Windows crashes linking DuckDB with full debug info
          [[ "${{ runner.os }}" == Windows ]] && flags='-ldflags=-s -w'
          go test -count=1 ${flags:+"$flags"} ./... 2>&1 | tee test.log || {
            { grep -B6 'collect2' test.log | grep -iE 'undefined|ld(\.lld|\.exe)?:|error|warning' | grep -v 'collect2' | sed 's#.*go-link-[0-9]*##' | cut -c1-300 | sort -u | head -8
              grep -E -- '--- FAIL|^\s+\S+_test\.go:[0-9]+:|panic:' test.log | head -4
              grep -vE '^(ok|\?) ' test.log | tail -8 | cut -c1-300; } | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          {
            ver="${{ inputs.version }}"
            if [[ -z "$ver" ]]; then
              ver="${GITHUB_REF_NAME#v}"
              [[ "$GITHUB_REF" == refs/tags/* ]] || ver="0.1.0-${GITHUB_SHA::7}"
            fi
            exe=traffic66; [[ "${{ runner.os }}" == Windows ]] && exe=traffic66.exe
            if [[ -n "${{ matrix.goarch }}" ]]; then export GOARCH="${{ matrix.goarch }}" CC="${{ matrix.cc }}"; fi
            scripts/build.sh "$ver" "dist/traffic66-${{ matrix.target }}/$exe"
            cp README.md "dist/traffic66-${{ matrix.target }}/"
            cp -r docs "dist/traffic66-${{ matrix.target }}/"
            [[ -f LICENSE ]] && cp LICENSE "dist/traffic66-${{ matrix.target }}/"
            cp inventory.txt.example "dist/traffic66-${{ matrix.target }}/"
            [[ -n "${{ matrix.cross }}" ]] || "dist/traffic66-${{ matrix.target }}/$exe" version
          } 2>&1 | tee build.log
      - name: Check run-time dependencies
        run: |
          exe=dist/traffic66-${{ matrix.target }}/traffic66
          case "${{ runner.os }}" in
          Linux)
            # fully static: no glibc version requirement at all
            out=$(ldd "$exe" 2>&1 || true); echo "$out"
            grep -qE 'not a dynamic executable|statically linked' <<<"$out" || { echo "::error::Linux build is not static: $out"; exit 1; } ;;
          Windows)
            objdump -p "$exe.exe" | grep 'DLL Name'
            if objdump -p "$exe.exe" | grep -iE 'DLL Name: *(libstdc|libgcc|libwinpthread|msys)'; then echo "::error::needs MinGW DLLs"; exit 1; fi ;;
          macOS)
            otool -L "$exe"
            if otool -L "$exe" | tail -n +2 | grep -vE '^\s*/(usr/lib|System)/'; then echo "::error::unexpected library"; exit 1; fi
            otool -l "$exe" | grep -A3 LC_BUILD_VERSION | grep minos ;;
          esac
      - name: Smoke test (demo starts and serves the API)
        if: ${{ !matrix.cross }}
        run: |
          exe=dist/traffic66-${{ matrix.target }}/traffic66; [[ "${{ runner.os }}" == Windows ]] && exe="$exe.exe"
          # on Windows, run without the build tools on PATH, as on a user's machine
          if [[ "${{ runner.os }}" == Windows ]]; then
            env PATH="/c/Windows/System32:/c/Windows" "$exe" demo -data "$RUNNER_TEMP/demo" -password ci -addr 127.0.0.1:18066 -listen "" &
          else
            "$exe" demo -data "$RUNNER_TEMP/demo" -password ci -addr 127.0.0.1:18066 -listen "" &
          fi
          for i in $(seq 1 90); do curl -sf -u admin:ci http://127.0.0.1:18066/api/status >/dev/null && break; sleep 2; done
          # to a file first: piping into head can cut curl off (exit 23)
          curl -sf -u admin:ci "http://127.0.0.1:18066/api/topn?dim=client&limit=66" -o "$RUNNER_TEMP/topn.json"
          head -c 300 "$RUNNER_TEMP/topn.json"
          kill %1 || true
      - name: Package
        run: |
          cd dist
          if [[ "${{ runner.os }}" == Windows ]]; then 7z a "traffic66-${{ matrix.target }}.zip" "traffic66-${{ matrix.target }}" >/dev/null
          else tar czf "traffic66-${{ matrix.target }}.tar.gz" "traffic66-${{ matrix.target }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: traffic66-${{ matrix.target }}
          path: dist/traffic66-${{ matrix.target }}.*

  old-linux:
    # the Linux packages must run on CentOS 7 (glibc 2.17, kernel 3.10 without
    # getrandom, emulated with seccomp) and on Alpine (musl)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-amd64
          - os: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: traffic66-${{ matrix.target }}
      - name: Run on CentOS 7 and Alpine
        run: |
          tar xzf traffic66-${{ matrix.target }}.tar.gz
          d="$PWD/traffic66-${{ matrix.target }}"
          echo '{"defaultAction":"SCMP_ACT_ALLOW","syscalls":[{"names":["getrandom"],"action":"SCMP_ACT_ERRNO","errnoRet":38}]}' > nogetrandom.json
          for img in centos:7 alpine:3.20; do
            echo "::group::$img"
            docker run --rm --security-opt seccomp="$PWD/nogetrandom.json" -v "$d:/t66" "$img" sh -c '
              /t66/traffic66 version || exit 1
              /t66/traffic66 demo -data /tmp/d -password ci -addr 127.0.0.1:18066 -listen "" > /tmp/log 2>&1 &
              for i in $(seq 1 90); do
                if wget -q -O /dev/null --header "Authorization: Basic YWRtaW46Y2k=" "http://127.0.0.1:18066/api/topn?dim=client&limit=66" 2>/dev/null ||
                   curl -sf -o /dev/null -u admin:ci "http://127.0.0.1:18066/api/topn?dim=client&limit=66" 2>/dev/null; then echo "running and serving"; exit 0; fi
                sleep 2
              done
              cat /tmp/log; exit 1' || { echo "::error::does not run on $img"; exit 1; }
            echo "::endgroup::"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [build, old-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Version must be new
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 0.1.1"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "::error::$TAG already exists; choose a higher version"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Release notes from CHANGELOG.md
        env:
          VER: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          v="${VER#v}"
          awk -v h="## $v" '$0==h{on=1;next} /^## /{if(on)exit} on' src/CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then echo "found notes for $v"; else echo "::warning::no section '## $v' in CHANGELOG.md"; fi
          echo "" >> notes.md
          echo "Downloads and installation: see the README." >> notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # a tag push attaches the archives to that tag's release; a manual run
      # creates the tag on the commit it built and publishes the release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('traffic66 {0}', inputs.version) || '' }}
          body_path: notes.md
          files: dist/*

  cleanup:
    # a manual run also deletes branches that are merged or abandoned: every
    # branch except main, the default branch, and branches of open pull requests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old branches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].head.ref')
          for b in $(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate --jq '.[].name'); do
            if [[ "$b" == main || "$b" == "$DEFAULT" ]] || grep -qxF "$b" <<<"$open"; then echo "keep   $b"; continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" && echo "delete $b"
          done
