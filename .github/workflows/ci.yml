name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-amd64
          - os: ubuntu-22.04-arm
            target: linux-arm64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-amd64
          # the runner's own MinGW gcc links DuckDB (as in duckdb-go's CI)
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Resolve modules
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          # failing tests become annotations, readable without downloading logs
          flags=""
          # GNU ld on Windows crashes linking DuckDB with full debug info
          [[ "${{ runner.os }}" == Windows ]] && flags='-ldflags=-s -w'
          go test -count=1 ${flags:+"$flags"} ./... 2>&1 | tee test.log || {
            { grep -B6 'collect2' test.log | grep -iE 'undefined|ld(\.lld|\.exe)?:|error|warning' | grep -v 'collect2' | sed 's#.*go-link-[0-9]*##' | cut -c1-300 | sort -u | head -8
              grep -E -- '--- FAIL|^\s+\S+_test\.go:[0-9]+:|panic:' test.log | head -4
              grep -vE '^(ok|\?) ' test.log | tail -8 | cut -c1-300; } | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          {
            ver="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF" == refs/tags/* ]] || ver="0.1.0-${GITHUB_SHA::7}"
            exe=traffic66; [[ "${{ runner.os }}" == Windows ]] && exe=traffic66.exe
            if [[ -n "${{ matrix.goarch }}" ]]; then export GOARCH="${{ matrix.goarch }}" CC="${{ matrix.cc }}"; fi
            scripts/build.sh "$ver" "dist/traffic66-${{ matrix.target }}/$exe"
            cp README.md "dist/traffic66-${{ matrix.target }}/"
            [[ -f LICENSE ]] && cp LICENSE "dist/traffic66-${{ matrix.target }}/"
            cp inventory.txt.example "dist/traffic66-${{ matrix.target }}/"
            [[ -n "${{ matrix.cross }}" ]] || "dist/traffic66-${{ matrix.target }}/$exe" version
          } 2>&1 | tee build.log
      - name: Smoke test (demo starts and serves the API)
        if: ${{ !matrix.cross }}
        run: |
          exe=dist/traffic66-${{ matrix.target }}/traffic66; [[ "${{ runner.os }}" == Windows ]] && exe="$exe.exe"
          "$exe" demo -data "$RUNNER_TEMP/demo" -password ci -addr 127.0.0.1:18066 -listen "" &
          for i in $(seq 1 90); do curl -sf -u admin:ci http://127.0.0.1:18066/api/status >/dev/null && break; sleep 2; done
          curl -sf -u admin:ci "http://127.0.0.1:18066/api/topn?dim=client&limit=66" | head -c 300
          kill %1 || true
      - name: Package
        run: |
          cd dist
          if [[ "${{ runner.os }}" == Windows ]]; then 7z a "traffic66-${{ matrix.target }}.zip" "traffic66-${{ matrix.target }}" >/dev/null
          else tar czf "traffic66-${{ matrix.target }}.tar.gz" "traffic66-${{ matrix.target }}"; fi
      - name: Publish logs to a branch (Windows failures)
        if: failure() && runner.os == 'Windows'
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          cp test.log build.log "$RUNNER_TEMP/" 2>/dev/null || true
          git checkout --orphan "ci-logs-${{ github.run_id }}"
          git rm -rfq --cached . && git clean -fdxq
          cp "$RUNNER_TEMP"/*.log . 2>/dev/null || true
          go env > go-env.log
          git add -f *.log && git commit -qm "logs ${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/ci-logs-${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: traffic66-${{ matrix.target }}
          path: dist/traffic66-${{ matrix.target }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
